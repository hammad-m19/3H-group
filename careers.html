<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - 3H GROUP</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .careers-section { padding: 120px 0 60px; min-height: 80vh; }
        .job-card { background: var(--bg-tertiary); padding: 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .job-title { font-size: 1.5rem; color: var(--primary-color); margin-bottom: 10px; }
        .job-desc { color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; white-space: pre-wrap; }
        .apply-btn { cursor: pointer; }
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-secondary); padding: 40px; border-radius: 12px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-secondary); }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: var(--bg-tertiary); color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-container">
                <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
                    <div class="logo-h">
                        <div class="h-left"></div><div class="h-center"></div><div class="h-right"></div>
                    </div>
                    <div class="logo-text">
                        <span class="logo-3h">3H</span><span class="logo-group">GROUP</span>
                    </div>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="careers.html" class="nav-link">Careers</a></li>
            </ul>
        </div>
    </nav>

    <section class="careers-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Join Our Team</h2>
                <p class="section-subtitle">We're always looking for talented individuals.</p>
            </div>
            <div id="jobs-container">
                <p style="text-align:center; color: var(--text-secondary);">Loading open positions...</p>
            </div>
        </div>
    </section>

    <!-- Application Modal -->
    <div class="modal-overlay" id="applyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Apply for <span id="modalJobTitle"></span></h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="applyForm">
                <input type="hidden" id="jobId" name="jobId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="appName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="appEmail" required>
                </div>
                <div class="form-group">
                    <label>Why are you a good fit?</label>
                    <textarea id="appAnswers" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Resume (PDF only)</label>
                    <input type="file" id="appResume" accept="application/pdf" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Application</button>
            </form>
            <div id="applyMessage" style="margin-top: 15px; text-align: center;"></div>
        </div>
    </div>

    <script src="careers.js"></script>
</body>
</html>
