<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - 3H GROUP</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .careers-section { padding: 120px 0 80px; min-height: 80vh; background: radial-gradient(circle at 50% -20%, #1a1a2e 0%, var(--bg-primary, #0a0a0a) 80%); }
        
        #jobs-container { display: grid; gap: 30px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
        
        .job-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, background 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .job-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--primary-color, #ef4444), #f87171);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        
        .job-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            background: rgba(255, 255, 255, 0.05);
        }
        .job-card:hover::before { transform: scaleX(1); }
        
        .job-title { font-size: 1.6rem; color: #fff; margin-bottom: 12px; font-weight: 700; letter-spacing: -0.02em; }
        .job-desc { color: rgba(255,255,255,0.7); margin-bottom: 25px; line-height: 1.7; white-space: pre-wrap; font-size: 0.95rem; }
        
        .apply-btn { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: 600; 
            background: var(--primary-color, #ef4444); 
            color: white; 
            border: none; 
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .apply-btn:hover { background: #dc2626; transform: scale(1.02); }
        
        /* Modal Styles */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            z-index: 1000; justify-content: center; align-items: center; 
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-content { 
            background: #18181b; 
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; 
            border-radius: 20px; 
            width: 90%; max-width: 500px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
            transform: scale(0.95); opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: scale(1); opacity: 1; }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .modal-header h3 { color: #fff; font-size: 1.5rem; font-weight: 700; margin: 0; }
        .close-modal { 
            background: rgba(255,255,255,0.1); border: none; color: white; 
            width: 36px; height: 36px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; transition: background 0.2s;
        }
        .close-modal:hover { background: rgba(255,255,255,0.2); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.8); font-size: 0.9rem; font-weight: 500; }
        .form-group input[type="text"], 
        .form-group input[type="email"], 
        .form-group textarea { 
            width: 100%; padding: 14px; border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.15); 
            background: rgba(0,0,0,0.2); color: white; 
            font-family: inherit; font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary-color, #ef4444);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        
        .form-group input[type="file"]::file-selector-button {
            padding: 8px 16px; border-radius: 6px; border: none;
            background: rgba(255,255,255,0.1); color: white; font-weight: 500;
            cursor: pointer; transition: background 0.2s; margin-right: 15px;
        }
        .form-group input[type="file"]::file-selector-button:hover { background: rgba(255,255,255,0.2); }
        .form-group input[type="file"] { color: rgba(255,255,255,0.6); font-size: 0.9rem; }
        
        #applyMessage { font-size: 0.95rem; font-weight: 500; min-height: 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-container">
                <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
                    <div class="logo-h">
                        <div class="h-left"></div><div class="h-center"></div><div class="h-right"></div>
                    </div>
                    <div class="logo-text">
                        <span class="logo-3h">3H</span><span class="logo-group">GROUP</span>
                    </div>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="careers.html" class="nav-link">Careers</a></li>
            </ul>
        </div>
    </nav>

    <section class="careers-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Join Our Team</h2>
                <p class="section-subtitle">We're always looking for talented individuals.</p>
            </div>
            <div id="jobs-container">
                <p style="text-align:center; color: var(--text-secondary);">Loading open positions...</p>
            </div>
        </div>
    </section>

    <!-- Application Modal -->
    <div class="modal-overlay" id="applyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Apply for <span id="modalJobTitle"></span></h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="applyForm">
                <input type="hidden" id="jobId" name="jobId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="appName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="appEmail" required>
                </div>
                <div class="form-group">
                    <label>Why are you a good fit?</label>
                    <textarea id="appAnswers" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Resume (PDF only)</label>
                    <input type="file" id="appResume" accept="application/pdf" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Application</button>
            </form>
            <div id="applyMessage" style="margin-top: 15px; text-align: center;"></div>
        </div>
    </div>

    <script src="careers.js"></script>
</body>
</html>
